<!doctype html>

<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>N.Geolitics — Índices históricos</title>
<meta content="Índices históricos de precio y retorno real, base 1900=100." name="description"/>
<link href="../assets/faviconNG.png" rel="icon"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Afacad:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
    :root {
      --bg: #252525;
      --panel: rgba(255,255,255,.03);
      --panel2: rgba(255,255,255,.05);
      --stroke: #3a3a3a;
      --grid: rgba(255,255,255,.10);
      --text: #e3e3e3;
      --muted: #b0b0b0;
      --accent: #FEF702;
      --shadow: 0 14px 34px rgba(0,0,0,.26);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      line-height: 1.4;
    }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    a:focus-visible, button:focus-visible, input:focus-visible, label:focus-within {
      outline: 2px solid rgba(254,247,2,.55);
      outline-offset: 3px;
      border-radius: 12px;
    }
    .page {
      min-height: 100vh;
      width: 100%;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .panel {
      width: 100%;
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.02));
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .chartPanel {
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto minmax(0,1fr);
    }
    .topBar {
      padding: 16px 18px 12px;
      display: grid;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,.05);
    }
    .titleRow {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }
    h1 {
      margin: 0;
      color: var(--accent);
      font-size: clamp(24px, 2.7vw, 40px);
      letter-spacing: .2px;
      line-height: 1.05;
    }
    .subtle {
      color: var(--muted);
      font-size: 13px;
    }
    .backLink {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: rgba(255,255,255,.9);
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      padding: 9px 12px;
      border-radius: 999px;
      transition: .15s ease;
      line-height: 1;
    }
    .backLink:hover {
      border-color: rgba(254,247,2,.35);
      background: rgba(255,255,255,.06);
    }
    .intro {
      margin: 0;
      max-width: 1120px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.48;
    }
    .intro strong { color: var(--text); }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 14px 18px;
      align-items: end;
    }
    .field {
      display: grid;
      gap: 8px;
      min-width: 220px;
    }
    .field.seriesField {
      flex: 1 1 520px;
      min-width: min(100%, 520px);
    }
    .field.actionsField { min-width: 250px; }
    .label, .labelTitle {
      font-size: 12px;
      letter-spacing: .35px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .labelTitle { color: var(--muted); }
    .segmented, .modeRow, .seriesGrid, .actionRow {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .btn, .toggle {
      appearance: none;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      color: rgba(255,255,255,.92);
      padding: 10px 13px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
      transition: .15s ease;
      line-height: 1;
      user-select: none;
      white-space: nowrap;
    }
    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 11px;
      background: rgba(0,0,0,.16);
    }
    .btn:hover, .toggle:hover {
      border-color: rgba(254,247,2,.35);
      background: rgba(255,255,255,.06);
    }
    .btn:active { transform: translateY(1px); }
    .btn.primary {
      background: rgba(254,247,2,.92);
      border-color: rgba(254,247,2,.98);
      color: #161616;
      font-weight: 700;
    }
    .toggle input { accent-color: var(--accent); margin: 0; }
    .toggle .swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      border: 1px solid rgba(255,255,255,.35);
    }
    .chartHead {
      padding: 14px 18px 10px;
      border-top: 1px solid rgba(255,255,255,.05);
      border-bottom: 1px solid rgba(255,255,255,.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }
    .chartHead .left {
      color: var(--accent);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .45px;
      font-weight: 700;
    }
    .chartHead .right {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
      max-width: 980px;
    }
    .chartArea {
      min-height: 0;
      padding: 14px;
    }
    .chartBox {
      position: relative;
      width: 100%;
      height: calc(100vh - 250px);
      min-height: 560px;
      border-radius: 14px;
      background: rgba(0,0,0,.12);
      border: 1px solid rgba(255,255,255,.06);
      overflow: hidden;
    }
    #chart {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .chartFoot {
      padding: 0 18px 14px;
      display: grid;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
    }
    .status {
      color: #f4f4f4;
      font-family: Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.45;
      min-height: 22px;
      overflow-x: auto;
      white-space: nowrap;
      background: rgba(0,0,0,.22);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 12px;
      padding: 9px 10px;
    }
    .legend {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--muted);
    }
    .legendItem {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: rgba(255,255,255,.86);
      font-size: 12px;
    }
    .lineKey {
      width: 24px;
      height: 3px;
      border-radius: 99px;
      display: inline-block;
      vertical-align: middle;
      margin-right: 6px;
    }
    .statsGrid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 12px;
    }
    .statCard {
      width: 100%;
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.02));
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px 18px 16px;
      min-height: 112px;
    }
    .statCard .k {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .35px;
      font-size: 12px;
    }
    .statCard .v {
      color: var(--accent);
      font-weight: 700;
      font-size: clamp(22px, 2.1vw, 32px);
      line-height: 1.05;
      margin-top: 8px;
    }
    .statCard .s {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      margin-top: 8px;
    }
    .panelTitle {
      padding: 14px 18px 10px;
      border-bottom: 1px solid rgba(255,255,255,.05);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .panelTitle h2 {
      margin: 0;
      color: var(--accent);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .45px;
    }
    .panelTitle p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }
    .tableWrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 760px; }
    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      font-size: 13px;
    }
    th {
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: .28px;
      background: rgba(0,0,0,.22);
      position: sticky;
      top: 0;
    }
    td { color: rgba(255,255,255,.88); }
    td.muted { color: var(--muted); }
    .explain {
      padding: 14px 18px 16px;
      display: grid;
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
    }
    .explain strong { color: var(--text); }
    .explainGrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .note {
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px;
      background: rgba(0,0,0,.14);
      padding: 14px;
    }
    .note h3 {
      margin: 0 0 8px 0;
      color: var(--text);
      font-size: 15px;
    }
    .note p { margin: 0; line-height: 1.48; }
    .sources code {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 6px;
      padding: 2px 5px;
      color: #fff;
    }
    @media (max-width: 980px) {
      .page { padding: 12px; }
      .chartHead { align-items: start; flex-direction: column; }
      .chartHead .right { text-align: left; }
      .chartArea { padding: 12px; }
      .chartBox { min-height: 480px; height: calc(100vh - 310px); }
      .statsGrid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .explainGrid { grid-template-columns: 1fr; }
    }
    @media (max-width: 620px) {
      .field, .field.seriesField, .field.actionsField { min-width: 100%; }
      .toggle, .btn { width: 100%; justify-content: flex-start; }
      .chartBox { min-height: 420px; height: calc(100vh - 350px); }
      .statsGrid { grid-template-columns: 1fr; }
      .status { white-space: normal; }
      h1 { font-size: 25px; }
    }
  </style>
</head>
<body>
<div class="page">
<section class="panel chartPanel">
<div class="topBar">
<div class="titleRow">
<h1>Índices bursátiles históricos</h1>

</div>

<div class="controls">
<div class="field">
<div class="label">Modo JST</div>
<div class="segmented modeRow" id="modeRow"></div>
</div>
<div class="field seriesField">
<div class="label">Series visibles</div>
<div class="segmented seriesGrid" id="seriesGrid"></div>
</div>

</div>
</div>
<div class="chartHead">
<div class="left" id="chartTitle">Índices de precio históricos</div>
<div class="right" id="chartSubtitle">Todas las series están rebasadas a 1900=100.</div>
</div>
<div class="chartArea">
<div class="chartBox">
<canvas aria-label="Gráfico de índices históricos" id="chart"></canvas>
</div>
</div>

</section>



</div>
<script src="series-data.js"></script>
<script>
    const DATA = window.NG_SERIES_DATA;
    const state = {
      mode: 'real',
      visible: new Map(),
      hover: null,
      pixelRatio: Math.max(1, window.devicePixelRatio || 1)
    };

    const els = {
      modeRow: document.getElementById('modeRow'),
      seriesGrid: document.getElementById('seriesGrid'),
      chart: document.getElementById('chart'),
      status: document.getElementById('status'),
      legend: document.getElementById('legend'),
      statsGrid: document.getElementById('statsGrid'),
      seriesTable: document.getElementById('seriesTable'),
      chartTitle: document.getElementById('chartTitle'),
      chartSubtitle: document.getElementById('chartSubtitle'),
      chartHead: document.querySelector('.chartHead'),
      resetBtn: document.getElementById('resetBtn'),
      selectAllBtn: document.getElementById('selectAllBtn'),
      clearBtn: document.getElementById('clearBtn')
    };
    const ctx = els.chart.getContext('2d');

    const modeLabels = {
      nominal: 'Nominal (precio, eq_capgain)',
      real: 'Ajustado por inflación (TR real)'
    };

    const historicalFragments = [
      {
        start: Date.UTC(1914, 6, 28),
        end: Date.UTC(1918, 10, 11),
        label: 'Primera Guerra Mundial'
      },
      {
        start: Date.UTC(1939, 8, 1),
        end: Date.UTC(1945, 8, 2),
        label: 'Segunda Guerra Mundial'
      }
    ];

    function parseDateUTC(s){
      const [y,m,d] = s.split('-').map(Number);
      return Date.UTC(y, m - 1, d);
    }
    function yearFromMs(ms){ return new Date(ms).getUTCFullYear(); }
    function dateLabel(ms){
      const d = new Date(ms);
      const y = d.getUTCFullYear();
      const m = String(d.getUTCMonth() + 1).padStart(2, '0');
      const day = String(d.getUTCDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }
    function formatValue(v){
      if(!Number.isFinite(v)) return '—';
      if(v >= 1e9) return v.toExponential(3);
      if(v >= 100000) return Math.round(v).toLocaleString('es-ES');
      if(v >= 1000) return Math.round(v).toLocaleString('es-ES');
      if(v >= 100) return v.toLocaleString('es-ES', {maximumFractionDigits:1});
      if(v >= 10) return v.toLocaleString('es-ES', {maximumFractionDigits:2});
      return v.toLocaleString('es-ES', {maximumFractionDigits:4});
    }
    function cagr(points){
      if(points.length < 2) return NaN;
      const first = points[0];
      const last = points[points.length - 1];
      const years = (last.t - first.t) / (365.2425 * 24 * 3600 * 1000);
      return years > 0 ? Math.pow(last.v / first.v, 1 / years) - 1 : NaN;
    }
    function formatPct(v){
      return Number.isFinite(v) ? (v * 100).toLocaleString('es-ES', {maximumFractionDigits:2}) + '%' : '—';
    }

    for(const mode of Object.keys(DATA.modes)){
      for(const serie of DATA.modes[mode]){
        serie.points = serie.points
          .map(([date, value]) => ({t: parseDateUTC(date), v: Number(value)}))
          .filter(p => p.v > 0 && Number.isFinite(p.v))
          .sort((a,b) => a.t - b.t);

        const serieKey = `${serie.sid || ''} ${serie.name || ''} ${serie.shortName || ''}`.toLowerCase();
        if(serieKey.includes('alemania') || serieKey.includes('germany') || serieKey.includes('jst_germany')){
          serie.color = '#00D5FF';
          serie.width = Math.max(Number(serie.width) || 2, 2.6);
        }
      }
    }

    function currentSeries(){ return DATA.modes[state.mode]; }
    function activeSeries(){
      return currentSeries().filter(s => state.visible.get(s.sid) === true);
    }
    function initVisibility(){
      state.visible.clear();
      for(const serie of currentSeries()) state.visible.set(serie.sid, !!serie.visibleByDefault);
    }

    function renderModes(){
      els.modeRow.innerHTML = '';
      for(const mode of Object.keys(DATA.modes)){
        const label = document.createElement('label');
        label.className = 'toggle';
        label.innerHTML = `<input type="radio" name="mode" value="${mode}" ${mode === state.mode ? 'checked' : ''}> <span>${modeLabels[mode]}</span>`;
        label.querySelector('input').addEventListener('change', () => {
          const previous = new Map(state.visible);
          state.mode = mode;
          state.visible.clear();
          for(const serie of currentSeries()){
            state.visible.set(serie.sid, previous.has(serie.sid) ? previous.get(serie.sid) : !!serie.visibleByDefault);
          }
          state.hover = null;
          renderAll();
        });
        els.modeRow.appendChild(label);
      }
    }

    function renderSeriesSelectors(){
      els.seriesGrid.innerHTML = '';
      for(const serie of currentSeries()){
        const label = document.createElement('label');
        label.className = 'toggle';
        label.title = serie.source;
        label.innerHTML = `<input type="checkbox" ${state.visible.get(serie.sid) ? 'checked' : ''}> <span class="swatch" style="background:${serie.color}"></span> <span>${serie.name}</span>`;
        label.querySelector('input').addEventListener('change', (ev) => {
          state.visible.set(serie.sid, ev.target.checked);
          state.hover = null;
          renderAll(false);
        });
        els.seriesGrid.appendChild(label);
      }
    }

    function computeTransform(width, height){
      const active = activeSeries();
      if(active.length === 0) return null;
      const margin = {
        left: width < 620 ? 58 : 88,
        right: width < 620 ? 18 : 34,
        top: width < 620 ? 58 : 72,
        bottom: width < 620 ? 72 : 96
      };
      const plotW = Math.max(1, width - margin.left - margin.right);
      const plotH = Math.max(1, height - margin.top - margin.bottom);
      let xMin = Infinity, xMax = -Infinity, yMin = Infinity, yMax = -Infinity;
      for(const serie of active){
        for(const p of serie.points){
          xMin = Math.min(xMin, p.t); xMax = Math.max(xMax, p.t);
          yMin = Math.min(yMin, p.v); yMax = Math.max(yMax, p.v);
        }
      }
      if(!Number.isFinite(xMin) || !Number.isFinite(yMin)) return null;
      if(xMin === xMax) xMax += 24 * 3600 * 1000;
      const logMin = Math.floor(Math.log10(yMin));
      const logMax = Math.ceil(Math.log10(yMax));
      const logSpan = Math.max(1, logMax - logMin);
      const tx = (t) => margin.left + ((t - xMin) / (xMax - xMin)) * plotW;
      const ty = (v) => margin.top + (1 - ((Math.log10(v) - logMin) / logSpan)) * plotH;
      return {active, margin, plotW, plotH, xMin, xMax, yMin, yMax, logMin, logMax: logMin + logSpan, tx, ty};
    }

    function resizeCanvas(){
      const rect = els.chart.getBoundingClientRect();
      const ratio = Math.max(1, window.devicePixelRatio || 1);
      state.pixelRatio = ratio;
      const width = Math.max(320, Math.round(rect.width));
      const height = Math.max(420, Math.round(rect.height));
      if(els.chart.width !== width * ratio || els.chart.height !== height * ratio){
        els.chart.width = width * ratio;
        els.chart.height = height * ratio;
      }
      ctx.setTransform(ratio,0,0,ratio,0,0);
      return {width, height};
    }

    function draw(){
      const {width, height} = resizeCanvas();
      ctx.clearRect(0,0,width,height);
      ctx.fillStyle = '#252525';
      ctx.fillRect(0,0,width,height);

      const tr = computeTransform(width, height);
      if(!tr){
        ctx.fillStyle = '#e3e3e3';
        ctx.font = '700 18px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Activa al menos una serie.', width / 2, height / 2);
        if(els.status) els.status.textContent = 'Sin series visibles';
        return;
      }
      const {margin, plotW, plotH, xMin, xMax, logMin, logMax, tx, ty, active} = tr;
      const plotRight = width - margin.right;
      const plotBottom = height - margin.bottom;

      ctx.fillStyle = 'rgba(0,0,0,.12)';
      ctx.strokeStyle = 'rgba(255,255,255,.16)';
      ctx.lineWidth = 1;
      ctx.fillRect(margin.left, margin.top, plotW, plotH);
      ctx.strokeRect(margin.left, margin.top, plotW, plotH);

      for(const fragment of historicalFragments){
        const start = Math.max(fragment.start, xMin);
        const end = Math.min(fragment.end, xMax);
        if(end <= start) continue;
        const x1 = tx(start);
        const x2 = tx(end);
        const bandW = Math.max(1, x2 - x1);

        ctx.fillStyle = 'rgba(254,247,2,.08)';
        ctx.fillRect(x1, margin.top, bandW, plotH);

        ctx.save();
        ctx.strokeStyle = 'rgba(254,247,2,.18)';
        ctx.setLineDash([3, 5]);
        ctx.beginPath();
        ctx.moveTo(x1, margin.top);
        ctx.lineTo(x1, plotBottom);
        ctx.moveTo(x2, margin.top);
        ctx.lineTo(x2, plotBottom);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.translate(x1 + bandW / 2, margin.top + 12);
        ctx.rotate(-Math.PI / 2);
        ctx.fillStyle = 'rgba(254,247,2,.88)';
        ctx.font = width < 620 ? '700 10px Arial' : '700 11px Arial';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillText(fragment.label, 0, 0);
        ctx.restore();
      }

      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.font = '12px Menlo, Consolas, monospace';
      for(let exp = logMin; exp <= logMax; exp++){
        const value = Math.pow(10, exp);
        const y = ty(value);
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255,255,255,.10)';
        ctx.moveTo(margin.left, y);
        ctx.lineTo(plotRight, y);
        ctx.stroke();
        ctx.fillStyle = '#b0b0b0';
        ctx.fillText(`10^${exp}`, margin.left - 9, y);
      }

      const firstYear = yearFromMs(xMin);
      const lastYear = yearFromMs(xMax);
      const step = (lastYear - firstYear > 180) ? 50 : 25;
      const startYear = Math.ceil(firstYear / step) * step;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.font = '12px Arial';
      for(let year = startYear; year <= lastYear; year += step){
        const x = tx(Date.UTC(year, 0, 1));
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255,255,255,.07)';
        ctx.moveTo(x, margin.top);
        ctx.lineTo(x, plotBottom);
        ctx.stroke();
        ctx.fillStyle = '#b0b0b0';
        ctx.fillText(String(year), x, plotBottom + 18);
      }

      for(const serie of active){
        if(serie.points.length < 2) continue;
        ctx.beginPath();
        ctx.strokeStyle = serie.color;
        ctx.lineWidth = serie.width;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        let started = false;
        let lastX = -Infinity;
        for(const p of serie.points){
          const x = tx(p.t);
          const y = ty(p.v);
          // Slight pixel decimation for dense daily series. Keeps endpoints and visible movement.
          if(started && Math.abs(x - lastX) < 0.28) continue;
          if(!started){ ctx.moveTo(x, y); started = true; }
          else ctx.lineTo(x, y);
          lastX = x;
        }
        ctx.stroke();
      }

      if(state.hover && state.hover.x >= margin.left && state.hover.x <= plotRight && state.hover.y >= margin.top && state.hover.y <= plotBottom){
        ctx.save();
        ctx.strokeStyle = 'rgba(254,247,2,.45)';
        ctx.lineWidth = 1;
        ctx.setLineDash([4,4]);
        ctx.beginPath();
        ctx.moveTo(state.hover.x, margin.top);
        ctx.lineTo(state.hover.x, plotBottom);
        ctx.moveTo(margin.left, state.hover.y);
        ctx.lineTo(plotRight, state.hover.y);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
      }

      ctx.strokeStyle = 'rgba(255,255,255,.72)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(margin.left, plotBottom);
      ctx.lineTo(plotRight, plotBottom);
      ctx.moveTo(margin.left, margin.top);
      ctx.lineTo(margin.left, plotBottom);
      ctx.stroke();

      ctx.fillStyle = '#FEF702';
      ctx.font = '700 19px Arial';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('Índices históricos', margin.left, 30);
      ctx.font = '13px Arial';
      ctx.fillStyle = '#b0b0b0';
      const subtitle = state.mode === 'real' ? 'JST en modo retorno total real ajustado por inflación' : 'JST en modo precio nominal (eq_capgain)';
      ctx.fillText(`Base 1900=100 · ${subtitle}`, margin.left, 52);

      ctx.save();
      ctx.translate(width < 620 ? 18 : 24, margin.top + plotH / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillStyle = '#e3e3e3';
      ctx.font = '700 13px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Valor (log10)', 0, 0);
      ctx.restore();

      if(state.hover){ updateHoverStatus(tr); }
      else updateSummaryStatus();
    }

    function nearestPoint(points, target){
      let lo = 0, hi = points.length - 1;
      while(lo < hi){
        const mid = (lo + hi) >> 1;
        if(points[mid].t < target) lo = mid + 1;
        else hi = mid;
      }
      const a = points[lo];
      const b = points[Math.max(0, lo - 1)];
      if(!b) return a;
      return Math.abs(a.t - target) < Math.abs(b.t - target) ? a : b;
    }

    function updateHoverStatus(transform){
      if(!els.status) return;
      const {margin, plotW, xMin, xMax, active} = transform;
      const target = xMin + ((state.hover.x - margin.left) / plotW) * (xMax - xMin);
      const parts = active.map(s => {
        const p = nearestPoint(s.points, target);
        return `${s.shortName}: ${dateLabel(p.t)}=${formatValue(p.v)}`;
      });
      els.status.textContent = parts.join(' | ');
    }
    function updateSummaryStatus(){
      if(!els.status) return;
      const active = activeSeries();
      if(!active.length){ els.status.textContent = 'Sin series visibles'; return; }
      els.status.textContent = active.map(s => {
        const a = s.points[0];
        const b = s.points[s.points.length - 1];
        return `${s.shortName}: ${yearFromMs(a.t)}-${yearFromMs(b.t)}, último=${formatValue(b.v)}`;
      }).join(' | ');
    }

    function renderLegend(){
      if(!els.legend) return;
      els.legend.innerHTML = '';
      for(const serie of activeSeries()){
        const item = document.createElement('span');
        item.className = 'legendItem';
        item.innerHTML = `<span class="lineKey" style="background:${serie.color}"></span>${serie.name}`;
        els.legend.appendChild(item);
      }
    }

    function renderStats(){
      if(!els.statsGrid) return;
      const active = activeSeries();
      const cards = [];
      if(!active.length){
        cards.push(['Series activas', '0', 'Activa al menos una serie para calcular métricas.']);
      } else {
        const points = active.flatMap(s => s.points.map(p => ({...p, sid:s.sid, name:s.shortName})));
        const firstYear = Math.min(...points.map(p => yearFromMs(p.t)));
        const lastYear = Math.max(...points.map(p => yearFromMs(p.t)));
        const latest = active.map(s => ({s, p:s.points[s.points.length - 1], cg:cagr(s.points)})).sort((a,b) => b.p.v - a.p.v)[0];
        const fastest = active.map(s => ({s, p:s.points[s.points.length - 1], cg:cagr(s.points)})).sort((a,b) => b.cg - a.cg)[0];
        cards.push(['Series activas', String(active.length), state.mode === 'real' ? 'JST en retorno total real.' : 'JST en precio nominal.']);
        cards.push(['Periodo visible', `${firstYear}–${lastYear}`, 'Rango mínimo y máximo entre las series seleccionadas.']);
        cards.push(['Mayor último valor', formatValue(latest.p.v), latest.s.name]);
        cards.push(['Mayor CAGR', formatPct(fastest.cg), fastest.s.name]);
      }
      els.statsGrid.innerHTML = cards.map(([k,v,s]) => `<article class="statCard"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></article>`).join('');
    }

    function renderTable(){
      if(!els.seriesTable) return;
      const active = activeSeries();
      if(!active.length){
        els.seriesTable.innerHTML = '<tr><td colspan="5" class="muted">No hay series visibles.</td></tr>';
        return;
      }
      els.seriesTable.innerHTML = active.map(s => {
        const first = s.points[0];
        const last = s.points[s.points.length - 1];
        return `<tr>
          <td><span class="lineKey" style="background:${s.color}"></span> ${s.name}</td>
          <td>${dateLabel(first.t)} → ${dateLabel(last.t)}</td>
          <td>${formatValue(last.v)}</td>
          <td>${formatPct(cagr(s.points))}</td>
          <td class="muted">${s.source}</td>
        </tr>`;
      }).join('');
    }

    function renderText(){
      const hideJstHeader = state.mode === 'real';
      if(els.chartHead) els.chartHead.style.display = hideJstHeader ? 'none' : '';
      els.chartTitle.textContent = hideJstHeader ? '' : 'Índices de precio históricos';
      els.chartSubtitle.textContent = hideJstHeader
        ? ''
        : 'Todas las series están rebasadas a 1900=100; Alemania nominal queda desactivada por defecto por la hiperinflación.';
    }

    function renderAll(rebuildSelectors = true){
      renderModes();
      if(rebuildSelectors) renderSeriesSelectors();
      renderText();
      draw();
      renderLegend();
      renderStats();
      renderTable();
    }

    els.chart.addEventListener('mousemove', (ev) => {
      const rect = els.chart.getBoundingClientRect();
      state.hover = {x: ev.clientX - rect.left, y: ev.clientY - rect.top};
      draw();
    });
    els.chart.addEventListener('mouseleave', () => { state.hover = null; draw(); });
    els.chart.addEventListener('touchmove', (ev) => {
      if(!ev.touches.length) return;
      const rect = els.chart.getBoundingClientRect();
      state.hover = {x: ev.touches[0].clientX - rect.left, y: ev.touches[0].clientY - rect.top};
      draw();
    }, {passive:true});
    els.chart.addEventListener('touchend', () => { state.hover = null; draw(); });

    if(els.resetBtn) els.resetBtn.addEventListener('click', () => { initVisibility(); state.hover = null; renderAll(); });
    if(els.selectAllBtn) els.selectAllBtn.addEventListener('click', () => {
      for(const s of currentSeries()) state.visible.set(s.sid, true);
      state.hover = null; renderAll();
    });
    if(els.clearBtn) els.clearBtn.addEventListener('click', () => {
      for(const s of currentSeries()) state.visible.set(s.sid, false);
      state.hover = null; renderAll();
    });
    window.addEventListener('resize', () => draw());

    initVisibility();
    renderAll();
  </script>
</body>
</html>
